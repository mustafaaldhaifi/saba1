<!-- Loading Overlay -->
<div class="loading-overlay" *ngIf="isLoading">
    <div class="spinner"></div>
</div>
<app-branch-header
    [version]="version"
    [types]="types"
    [selectedType]="selectedType"
    (logoutRequested)="logout()"
    (typeChanged)="changeOrderType($event)">
</app-branch-header>
<app-branch-date-actions
    [orderDates]="preOrders"
    [allowedNewOrderDates]="datesToAdd"
    [selectedDate]="selectedDate"
    (dateSelected)="selectOrderDate($event)"
    (exportRequested)="exportPdf()"
    (newOrderRequested)="startNewOrder($event)">
</app-branch-date-actions>

<app-branch-order-context [selectedDate]="selectedDate" [branchName]="selectedBranchName"></app-branch-order-context>




<ng-container *ngIf="selectedDate && selectedType.id != '5'">
    <div style="background-color: red; color: white; text-align: center;"
        *ngIf="checkIfHasEmptyOrder() && isToAddMode === false">يوجد منتجات جديده
        يجب اضافة كميتها
    </div>


    <app-branch-standard-order-table
        [rows]="combinedData"
        [hasBranch]="!!branch"
        [orderTypeId]="selectedType?.id ?? ''"
        monthlyTypeId="WbAP06wLDRvZFTYUtkjU"
        weightTypeId="Ikt6pyFoTwvwn7GBIPvv"
        [canEditQuantities]="isSelectedTypeAllowed()"
        [isPreSent]="isPreSent"
        [isFieldDisabled]="isFieldDisabled"
        [isDropDownDisabled]="isDropDownDisabled"
        [selectedOrderStatus]="selectedPreOrder?.status ?? ''"
        [isAddedItem]="isItemInAdd.bind(this)"
        [statusColor]="getStatusColor.bind(this)"
        (availableQuantityChanged)="onQntFChange($event)"
        (requestedQuantityChanged)="updateRequestedQuantity($event)"
        (statusChanged)="onStatusChange($event)"
        (unmatchedQuantityChanged)="updateUnmatchedQuantity($event)"
        (cashToggled)="updateCashToggle($event)"
        (cashValueChanged)="updateCashValue($event)">
    </app-branch-standard-order-table>
    <app-branch-order-actions
        [hasEmptyProduct]="checkIfHasEmptyOrder()"
        [isAddingOrder]="isToAddMode"
        [isOrderComplete]="isFullFilled()"
        [isLoading]="isLoading"
        [isPreSent]="isPreSent"
        [hasUpdates]="ordersToUpdate.length > 0"
        [canSaveUpdates]="isUpdateEnabled()"
        (saveNewProductsRequested)="addOrders(true)"
        (sendOrderRequested)="addOrders()"
        (saveUpdatesRequested)="saveUpdates()">
    </app-branch-order-actions>

</ng-container>

<app-branch-daily-toolbar
    *ngIf="selectedType && selectedType.id == '5'"
    [dates]="dailyReportsDates"
    [selectedDate]="dateToAddInDaily"
    [branchName]="selectedBranchName"
    [reportGroups]="groupedDailyDates"
    [hasDailyReports]="dailyReports.length > 0"
    [hasUnsavedChanges]="orderDailyToUpdate.length > 0"
    (dateChanged)="selectDailyReportDate($event)"
    (exportAllRequested)="exportDailyReportGroup($event)"
    (exportAllNotesRequested)="exportDailyNotesGroup($event)"
    (exportCurrentRequested)="exportPdfDaily()"
    (saveChangesRequested)="saveChangesDaily()">
</app-branch-daily-toolbar>

<ng-container *ngIf="selectedType && selectedType.id == '5' && dateToAddInDaily">



    <div class=" table-container">
        <div class="table ">
            <table *ngIf="branch" class="styled-table">
                <thead>
                    <tr vz class="f-h">
                        <th style="position: sticky; left: 0;">الاصناف</th>
                        <th style="width: 28px;">
                            الموجودة
                        </th>
                        <th>المستلم</th>
                        <th>الجرد</th>
                        <th>مبيعات</th>
                        <th>وجبة موظف</th>
                        <th>تعويض زبون</th>
                        <th>مكنسل</th>
                        <th>تحويل مباشر</th>
                        <th>تحويل % </th>
                        <th>التالف</th>
                        <th>المتبقي</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of combinedData; let i = index"
                        [style.background-color]="i % 2 === 0 ? '#f8f9fa' : '#e9ecef'"
                        [style.border-bottom]="'1px solid #dee2e6'">
                        <td [style.background-color]="i % 2 === 0 ? '#f8f9fa' : '#e9ecef'"
                            style="position: sticky; left: 0; padding: 0;">
                            <!-- إذا لديه منتجات فرعية -->
                            <ng-container *ngIf="item.products?.length; else normalProduct">
                                <div style="display: flex; align-items: stretch; border: 1px solid #ccc;">
                                    <!-- المنتج الرئيسي بشكل عمودي -->
                                    <div style="
          writing-mode: vertical-rl;
          transform: rotate(180deg);
          font-weight: bold;
          font-size: 13px;
          padding: 8px;
          text-align: center;
          border-right: 1px solid #ccc;
          background-color: #f1f1f1;
          min-width: 30px;
        ">
                                        {{ item.productName }}
                                    </div>

                                    <!-- المنتجات الفرعية -->
                                    <div style="
          display: flex;
          flex-direction: column;
          flex-grow: 1;
          font-size: 12px;
        ">
                                        <div *ngFor="let subProduct of item.products" style="
            padding: 6px 8px;
            border-bottom: 1px solid #ccc;
          ">
                                            {{ subProduct.productName }}
                                        </div>
                                    </div>
                                </div>
                            </ng-container>

                            <!-- إذا لا يوجد له منتجات فرعية -->
                            <ng-template #normalProduct>
                                <div style="
        font-weight: bold;
        font-size: 13px;
        padding: 8px;
        border: 1px solid #ccc;
      ">
                                    {{ item.productName }}
                                </div>
                            </ng-template>
                        </td>


                        <td>
                            <input [attr.tabindex]=" 1000 + i" *ngIf="!item.isSales"
                                [disabled]="isPositiveNumber(combinedData[i].openingStockQnt) && combinedData[i].openingStockId != -1 || isReadDailyMode === true"
                                (blur)="onQuantityChange('openingStockQnt', item, i)"
                                [(ngModel)]="combinedData[i].openingStockQnt" type="number" required>
                        </td>
                        <td>
                            <input [attr.tabindex]="2000 + i" [disabled]="isDisabledDailyField()" *ngIf="!item.isSales"
                                [(ngModel)]="item.recieved" (blur)="onQuantityChange('recieved', item, i)" min="0"
                                step="any" type="number" required>

                        </td>
                        <td>
                            <ng-container *ngIf="item.products?.length; else normalProduct1">
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="3000 + i"
                                            *ngIf="!subProduct.isSales" [disabled]="isDisabledDailyField()"
                                            (blur)="onQuantityChange('add', item, i,{i:s,subProduct})"
                                            [(ngModel)]="combinedData[i].products[s].add" type="number" required />
                                    </ng-container>
                                </div>
                            </ng-container>

                            <ng-template #normalProduct1>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="3000 + i"
                                    *ngIf="!item.isSales" [disabled]="isDisabledDailyField()"
                                    (blur)="onQuantityChange('add', item, i)" [(ngModel)]="combinedData[i].add"
                                    type="number" required />
                            </ng-template>
                        </td>



                        <ng-container *ngIf="item.products?.length; else normalProduct2">
                            <td>
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="4000 + i"
                                            [disabled]="isDisabledDailyField()"
                                            (blur)="onQuantityChange('sales', item, i,{i:s,subProduct})"
                                            [(ngModel)]="combinedData[i].products[s].sales" type="number" required />
                                    </ng-container>
                                </div>
                            </td>

                        </ng-container>

                        <ng-template #normalProduct2>
                            <td>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="4000 + i"
                                    [disabled]="isDisabledDailyField()" (blur)="onQuantityChange('sales', item, i)"
                                    [(ngModel)]="combinedData[i].sales" type="number" required />
                            </td>

                        </ng-template>



                        <ng-container *ngIf="item.products?.length; else normalProduct3">
                            <td>
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5000 + i"
                                            *ngIf="!subProduct.isSales" [disabled]="isDisabledDailyField()"
                                            (blur)="onQuantityChange('staffMeal', item, i,{i:s,subProduct})"
                                             [disabled]="isColumnLocked(item.productId || item.id,'staffMeal',selectedDate)"
                                            [(ngModel)]="combinedData[i].products[s].staffMeal" type="number" min="0"
                                            step="any" required />
                                    </ng-container>
                                </div>
                            </td>
                        </ng-container>

                        <ng-template #normalProduct3>
                            <td>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5000 + i"
                                    *ngIf="!item.isSales"
                                    [disabled]="isDisabledDailyField()  || isItemLocked(item.productId || item.id)"
                                    (blur)="onQuantityChange('staffMeal', item, i)" min="0" step="any"
                                    [disabled]="isColumnLocked(item.productId || item.id,'staffMeal',selectedDate)"
                                    [(ngModel)]="combinedData[i].staffMeal" type="number" required />
                            </td>
                        </ng-template>

                        <td>
                            <ng-container *ngIf="item.products?.length; else normalProduct41">
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5500 + i"
                                            *ngIf="!subProduct.isSales" min="0" step="any"
                                            [disabled]="isDisabledDailyField()"
                                            (blur)="onQuantityChange('freeIncrease', item, i,{i:s,subProduct})"
                                            [(ngModel)]="combinedData[i].products[s].freeIncrease" type="number"
                                            required />
                                    </ng-container>
                                </div>
                            </ng-container>

                            <ng-template #normalProduct41>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5500 + i" min="0"
                                    *ngIf="!item.isSales" step="any" [disabled]="isDisabledDailyField()"
                                    (blur)="onQuantityChange('freeIncrease', item, i)"
                                    [(ngModel)]="combinedData[i].freeIncrease" type="number" required />
                            </ng-template>
                        </td>

                        <td>
                            <ng-container *ngIf="item.products?.length; else normalProduct42">
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5600 + i"
                                            *ngIf="!subProduct.isSales" min="0" step="any"
                                            [disabled]="isDisabledDailyField()"
                                            (blur)="onQuantityChange('canceled', item, i,{i:s,subProduct})"
                                            [(ngModel)]="combinedData[i].products[s].canceled" type="number" required />
                                    </ng-container>
                                </div>
                            </ng-container>

                            <ng-template #normalProduct42>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="5600 + i" min="0"
                                    *ngIf="!item.isSales" step="any" [disabled]="isDisabledDailyField()"
                                    (blur)="onQuantityChange('canceled', item, i)"
                                    [(ngModel)]="combinedData[i].canceled" type="number" required />
                            </ng-template>
                        </td>


                        <td>
                            <input [disabled]="true" *ngIf="!item.isSales"
                                (blur)="onQuantityChange('directTransfer', item, i)"
                                [(ngModel)]="combinedData[i].directTransfer" type="number" required>

                        </td>

                        <td>
                            <input [attr.tabindex]="6000 + i" [disabled]="isDisabledDailyField()" *ngIf="!item.isSales"
                                (blur)="onQuantityChange('transfer', item, i)" [(ngModel)]="combinedData[i].transfer"
                                 [disabled]="isColumnLocked(item.productId || item.id,'transfer',selectedDate)"
                                type="number" required>

                        </td>
                        <td>
                            <ng-container *ngIf="item.products?.length; else normalProduct4">
                                <div class="d-flex flex-column gap-2 w-100">
                                    <ng-container *ngFor="let subProduct of item.products; let s = index">
                                        <input class="form-control1" [style.width.%]="100" [attr.tabindex]="7000 + i"
                                            *ngIf="!subProduct.isSales" min="0" step="any"
                                            (blur)="onQuantityChange('dameged', item, i,{i:s,subProduct})"
                                            [(ngModel)]="combinedData[i].products[s].dameged" type="number" required />
                                    </ng-container>
                                </div>
                            </ng-container>

                            <ng-template #normalProduct4>
                                <input class="form-control1" [style.width.%]="100" [attr.tabindex]="7000 + i" min="0"
                                    *ngIf="!item.isSales" step="any" (blur)="onQuantityChange('dameged', item, i)"
                                    [(ngModel)]="combinedData[i].dameged" type="number" required />
                            </ng-template>

                        </td>
                        <td *ngIf="!item.isSales">
                            <!-- {{calculateClosingStock(combinedData[i])}} -->
                            {{ combinedData[i].closeStock}}
                        </td>



                    </tr>
                </tbody>
            </table>


        </div>


    </div>

    <!-- <input *ngIf="ifEnabledNoteFiled()" type="text" placeholder="الملاحظة" [(ngModel)]="dialyNote"> -->
    <!-- <button (click)="saveDailyNote()"
        *ngIf="selectedDateToAddObject && selectedDateToAddObject.note != dialyNote && isAdmin">حفظ الملاحظة</button> -->
    <button [disabled]="ifHaveNegativeValue() == true || ifSalesCompleted() == false"
        *ngIf="dateToAddInDaily && ifThereisEmptyValue() == false && isReadDailyMode === false"
        (click)="saveDaily()">Save</button>




</ng-container>

<app-reason-dialog *ngIf="showReasonDialog" (onConfirm)="handleReasonConfirm($event)"
    (onCancel)="handleReasonCancel()"></app-reason-dialog>
