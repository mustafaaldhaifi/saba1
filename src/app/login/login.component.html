<div class="loading-overlay" *ngIf="isLoading || isSubmitting" role="status" aria-label="جارٍ التحميل">
  <div class="spinner"></div>
</div>
<div class="bodydiv">
  <div class="login-container">
    <div class="logo-container"></div>
    <div class="login-form">
      <h2>Login</h2>
      <p *ngIf="accountsError" class="auth-error" role="alert">{{ accountsError }}</p>
      <button *ngIf="accountsError" type="button" (click)="loadAccounts()" [disabled]="isLoading">إعادة تحميل الحسابات</button>
      <form #loginForm="ngForm" (ngSubmit)="login()" autocomplete="on">
        <div class="input-group">
          <label for="username">Account</label>
          <select id="username" name="username" [(ngModel)]="selectedOption" required
            [disabled]="isSubmitting || isLoading">
            <option value="" disabled>Select your account</option>
            <option *ngFor="let option of options" [value]="option">{{ option }}</option>
          </select>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" required
            autocomplete="current-password" placeholder="Enter your password" [disabled]="isSubmitting">
        </div>
        <label class="remember-session">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" [disabled]="isSubmitting">
          إبقاء تسجيل الدخول على هذا الجهاز
        </label>
        <p *ngIf="errorMessage" class="auth-error" role="alert">{{ errorMessage }}</p>
        <button type="submit" class="btn-login" [disabled]="loginForm.invalid || isLoading || isSubmitting || !!accountsError">
          {{ isSubmitting ? 'جارٍ تسجيل الدخول…' : 'Log In' }}
        </button>
      </form>
    </div>
  </div>
</div>
