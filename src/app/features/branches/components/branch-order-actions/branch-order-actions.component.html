<div class="order-actions" dir="rtl">
  <ng-container *ngIf="hasEmptyProduct && !isAddingOrder; else sendOrder">
    <button class="action-button products-button" type="button" (click)="saveNewProductsRequested.emit()"
      [disabled]="isLoading || !isOrderComplete">
      حفظ كميات المنتجات الجديدة
    </button>
  </ng-container>

  <ng-template #sendOrder>
    <button class="action-button send-button" type="button" (click)="sendOrderRequested.emit()"
      [disabled]="isLoading || !isOrderComplete">
      إرسال الطلب
    </button>
  </ng-template>

  <button class="action-button update-button" type="button" *ngIf="isPreSent && hasUpdates"
    (click)="saveUpdatesRequested.emit()" [disabled]="!canSaveUpdates">
    حفظ التعديلات
  </button>

  <button class="action-button draft-button" type="button" *ngIf="canSaveDraft"
    (click)="saveDraftRequested.emit()" [disabled]="isLoading || isDraftSaved">
    {{ isDraftSaved ? 'تم حفظ المسودة' : 'حفظ كمسودة' }}
  </button>
</div>

<p class="action-hint incomplete-hint" *ngIf="!isOrderComplete && (isAddingOrder || hasEmptyProduct)" dir="rtl" role="status">
  أكمل الحقول الفارغة المطلوبة ليتفعّل زر الإرسال.
</p>

<p class="action-hint saved-hint" *ngIf="isDraftSaved" dir="rtl" role="status">
  حُفظت القيم المدخلة. الحقول الفارغة تبقى مفتوحة لإكمالها، وبعد تعديلها يمكنك حفظ المسودة مرة أخرى.
</p>
