<!-- Existing orders: selecting one loads its data in the parent page. -->
<div *ngFor="let item of orderDates">
  <button (click)="dateSelected.emit(item)" style="width: 100%;" [class.selected]="isSelected(item.createdAt)">
    {{ item.createdAt.toDate() | date:'mediumDate' }}
  </button>
</div>

<!-- The export action is available only once an order date is selected. -->
<button *ngIf="selectedDate" (click)="exportRequested.emit()">Export Pdf</button>

<!-- Dates enabled by the administrator for creating a new branch order. -->
<div *ngFor="let item of allowedNewOrderDates">
  <button
    (click)="newOrderRequested.emit(item.createdAt)"
    style="width: 100%; background-color: brown;"
    [class.selected]="isSelected(item.createdAt)">
    {{ item.createdAt.toDate() | date:'mediumDate' }}
    <i class="fas fa-plus" style="margin-left: 10px;"></i>
  </button>
</div>
