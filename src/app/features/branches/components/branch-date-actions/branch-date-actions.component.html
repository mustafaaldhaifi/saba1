<section class="date-actions" dir="rtl">
  <div class="date-grid" *ngIf="orderDates.length">
    <button class="date-button" type="button" *ngFor="let item of orderDates"
      (click)="dateSelected.emit(item)" [class.selected]="isSelected(item.createdAt)">
      <span class="calendar-icon" aria-hidden="true">▣</span>
      <span>{{ item.createdAt.toDate() | date:'mediumDate' }}</span>
    </button>
  </div>

  <div class="date-toolbar" *ngIf="selectedDate">
    <button class="export-button" type="button" (click)="exportRequested.emit()">
      <span aria-hidden="true">⇩</span>
      تصدير PDF
    </button>
  </div>

  <div class="new-date-grid" *ngIf="allowedNewOrderDates.length">
    <button class="new-order-button" type="button" *ngFor="let item of allowedNewOrderDates"
      (click)="newOrderRequested.emit(item.createdAt)" [class.selected]="isSelected(item.createdAt)">
      <span class="plus-icon" aria-hidden="true">+</span>
      <span>طلب جديد ليوم {{ item.createdAt.toDate() | date:'mediumDate' }}</span>
    </button>
  </div>
</section>
