<div class="admin-controls">
  <button class="icon-btn logout" type="button" (click)="logoutRequested.emit()" aria-label="تسجيل الخروج">
    <i class="fas fa-power-off"></i>
  </button>
  <h6 class="version-label">{{ version }}</h6>
  <a routerLink="/documentation" class="btn" aria-label="فتح توثيق النظام">التوثيق</a>
  <button class="icon-btn reset" type="button" (click)="resetRequested.emit()" aria-label="مسح الكاش">
    <i class="fas fa-sync-alt"></i>
  </button>
</div>
