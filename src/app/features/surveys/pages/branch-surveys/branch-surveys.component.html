<main class="survey-page" dir="rtl"><section class="card"><header class="head"><h1>الاستبيانات الشهرية</h1><p>أكمل الاستبيان المطلوب للمتابعة.</p></header><div class="body"><p *ngIf="loading" class="message">جارٍ التحميل…</p><p *ngIf="error" class="message error">{{error}}</p><p *ngIf="success" class="message success">{{success}}</p><section *ngIf="active"><h2>{{active.title}}</h2><p>{{active.description}}</p><form [formGroup]="form"><div *ngFor="let q of active.questions" [formGroupName]="q.id" class="question"><label>{{q.label}} <b *ngIf="q.required">*</b></label><ng-container [ngSwitch]="q.type"><ng-container *ngSwitchCase="'document'"><input formControlName="documentNumber" placeholder="رقم الوثيقة"><label class="field-label">تاريخ الانتهاء</label><input formControlName="expiryDate" type="date" aria-label="تاريخ الانتهاء"></ng-container><ng-container *ngSwitchCase="'yes_no'"><div class="choices"><button type="button" [class.active]="form.get(q.id+'.value')?.value==='yes'" (click)="form.get(q.id+'.value')?.setValue('yes')">نعم</button><button type="button" [class.active]="form.get(q.id+'.value')?.value==='no'" (click)="form.get(q.id+'.value')?.setValue('no')">لا</button></div><textarea *ngIf="form.get(q.id+'.value')?.value==='no'" formControlName="reason" placeholder="سبب عدم التصحيح"></textarea></ng-container><textarea *ngSwitchDefault formControlName="value" placeholder="ملاحظات"></textarea></ng-container></div><footer class="actions"><button type="button" class="secondary" [disabled]="saving" (click)="save(false)">حفظ مسودة</button><button type="button" class="primary" [disabled]="saving" (click)="save(true)">إرسال الاستبيان</button></footer></form></section></div></section></main>
<div *ngIf="showLicenseQrNotice" class="notice-backdrop" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="qr-notice-title"><section class="notice-dialog"><div class="qr-icon" aria-hidden="true">▦</div><h2 id="qr-notice-title">تحقق من الرخصة أولًا</h2><p>يرجى مسح رمز QR الموجود في الرخصة للتأكد من حالة المستند وصلاحيته قبل تعبئة الاستبيان.</p><button type="button" class="primary notice-confirm" (click)="showLicenseQrNotice = false">فهمت، متابعة</button></section></div>
